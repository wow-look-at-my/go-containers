name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1

  # Runs the tests under -race: every collection here is concurrent, so a green build must mean tests ran race-checked.
  race:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -race
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          cgo: true
          targets: linux/amd64
          autorelease: false
