name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1

  # Every collection in this repository is a concurrent one, so a green build
  # must mean that the race detector saw the tests. A plain go-toolchain run
  # does not enable it, and a data race then reaches master unreported.
  #
  # This job tests; the build job above ships. So it builds one native target:
  # the race detector needs cgo, and it supports neither the cosmo fat APE nor
  # a cross-compile. autorelease is off because only the build job publishes.
  race:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -race
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          cgo: true
          targets: linux/amd64
          autorelease: false
