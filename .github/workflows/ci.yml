name: CI

on:
  push:
    branches: ['**']

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@master
        with:
          # The comparison suite measures every collection against what a caller
          # writes instead, which runs past the default budget and is killed
          # mid-benchmark, after the tests have already passed.
          timeout: '20'

  # Runs the tests under -race: every collection here is concurrent, so a green build must mean tests ran race-checked.
  race:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -race
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@master
        with:
          cgo: true
          autorelease: false
          timeout: '20'
