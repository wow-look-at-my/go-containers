name: CI

on:
  push:
    branches: ['**']

concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/go-toolchain@lkgb
        with:
          # The comparison suite outruns the default budget and is killed mid-benchmark.
          timeout: '20'

  # Runs the tests under -race: every collection here is concurrent, so a green build must mean tests ran race-checked.
  race:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The go-toolchain binary targets cosmo alone, and the race detector has no cosmo runtime, so a stock Go runs the tests here.
      - run: go test -race ./...
